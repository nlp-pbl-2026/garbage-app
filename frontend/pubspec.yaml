publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  table_calendar: ^3.1.0
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  http: ^1.2.0
