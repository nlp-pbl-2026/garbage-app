[project]
name = "garbage-app-backend"
version = "0.1.0"
description = "Backend API for the garbage collection app"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.2.1",
    "aiosqlite>=0.19.0",
    "boto3[crt]>=1.43.53",
    "fastapi>=0.110.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "sqlalchemy[asyncio]>=2.0.25",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
